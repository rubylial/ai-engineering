[project]
name = "api-agente"
version = "0.1.0"
description = "API FastAPI async sobre el orquestador multi-agente del M6: cola + Redis + Phoenix + HITL."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.118.0",
  "uvicorn[standard]>=0.37.0",
  "langchain-core>=0.3.68",
  "langchain-anthropic>=0.3.9",
  "langgraph>=1.2.0",
  "langgraph-checkpoint-redis>=0.6.0",
  "redis>=5.2.0",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.6.0",
  "arize-phoenix-otel>=0.8.0",
  "openinference-instrumentation-langchain>=0.1.40",
  "opentelemetry-sdk>=1.29.0",
  "httpx>=0.28.1",
]

[dependency-groups]
dev = [
  "pytest>=8.4.0",
  "pytest-asyncio>=1.2.0",
  "fakeredis>=2.26.0",
  "ruff>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ASYNC109"]  # helpers de polling con parámetro timeout
"scripts/**" = ["T201"]
