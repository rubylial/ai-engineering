[project]
name = "intelligence-system"
version = "1.0.0"
description = "The Intelligence System: RAG híbrido + agentes con Supervisor (LangGraph) + FastAPI + Arize Phoenix"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "rubylial" }]
dependencies = [
  # API
  "fastapi>=0.162.0",
  "uvicorn[standard]>=0.54.0",
  "sse-starlette>=3.6.0",
  "httpx>=0.28.1",
  "starlette>=1.10.0",  # middleware ASGI puro y excepciones (import directo)
  "anyio>=4.16.0",      # lectura async de archivos del corpus (import directo)
  # Validación y configuración
  "pydantic>=2.14.3",
  "pydantic-settings>=2.16.2",
  "pyyaml>=6.0.3",
  # LLM (cliente unificado de la pre-entrega 1)
  "anthropic>=2.5.0",
  "openai>=3.46.0",
  "tenacity>=9.2.1",
  # Agentes
  "langgraph>=1.2.20",
  "langgraph-checkpoint-redis>=0.6.0",
  "langchain-core>=1.7.6",
  "langchain-text-splitters>=1.1.3",
  # RAG
  "pinecone>=10.3.0",
  "redis>=8.1.0",
  # Observabilidad
  "structlog>=26.1.0",
  "arize-phoenix-otel>=0.17.2",
  "opentelemetry-sdk>=1.45.2",
  "openinference-instrumentation-langchain>=0.1.82",
  "openinference-instrumentation-anthropic>=3.3.1",
  "openinference-instrumentation-openai>=0.1.69",
]

[dependency-groups]
dev = [
  "pytest>=9.2.0",
  "pytest-asyncio>=1.4.1",
  "fakeredis>=2.40.0",
  "ruff>=0.17.3",
]

[project.scripts]
intelligence-system = "intelligence_system.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intelligence_system"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
  "E", "F", "W",   # pycodestyle + pyflakes
  "I",             # isort
  "B",             # bugbear
  "UP",            # pyupgrade
  "ASYNC",         # bloqueos dentro de async def (time.sleep, requests, open...)
  "SIM", "RUF",
  "ANN",           # type hints completos
  "S",             # bandit
  "PT",            # pytest
]
ignore = [
  "ANN401",  # Any explícito permitido en bordes con SDKs
  "RUF001", "RUF002", "RUF003",  # textos en español con caracteres "ambiguos" (á, ñ, ›)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "ANN", "PT011", "PT018"]
"scripts/**" = ["S101", "T201", "E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "integration: requiere servicios reales (RUN_INTEGRATION=1)",
]
filterwarnings = [
  "ignore::DeprecationWarning:pinecone.*",
  "ignore::DeprecationWarning:langgraph.checkpoint.redis.*",
]
