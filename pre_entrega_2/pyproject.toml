[project]
name = "entity-pipeline"
version = "0.1.0"
description = "Pipeline LCEL para extraer entidades técnicas con Pydantic v2 y reintentos."
requires-python = ">=3.12"
dependencies = [
  "langchain-core>=0.3.68",
  "langchain-anthropic>=0.3.9",
  "pydantic>=2.11.0",
]

[dependency-groups]
dev = [
  "pytest>=8.4.0",
  "pytest-asyncio>=1.2.0",
  "ruff>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/entity_pipeline"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
ignore = ["RUF001", "RUF002", "RUF003"]  # caracteres unicode en español (ñ, tildes, comillas)

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
